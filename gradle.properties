# JVM da build. -Xmx2g é suficiente para o projeto atual.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Builds mais rápidas e incrementais.
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX é obrigatório para as bibliotecas modernas usadas no app.
android.useAndroidX=true

# R class não-transitiva: cada módulo referencia apenas os próprios recursos.
# Reduz acoplamento e tempo de build. Padrão recomendado em projetos multi-módulo.
android.nonTransitiveRClass=true

# Estilo de código oficial do Kotlin.
kotlin.code.style=official
