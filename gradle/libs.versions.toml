# Catálogo de versões — fonte única de verdade para dependências e plugins.
#
# Compatibilidades fixadas (ver DECISIONS.md, 2026-08-13):
#   AGP 8.9.2  ↔  Gradle 8.11.1  ↔  JDK 17  ↔  compileSdk 35 (DAT 0.9.0). AGP 8.9
#   reabilita o lint com Kotlin 2.2 (o 8.7.2 tinha o bug NonNullableMutableLiveData).
#   Kotlin 2.2.0  → exigido pelo DAT 0.9.0 (metadata 2.2.0); Compose usa o
#   plugin org.jetbrains.kotlin.plugin.compose (versão casada com o Kotlin).
#
# Artefatos do DAT: mwdat 0.9.0 (grupo com.meta.wearable), confirmado via
# search_dat_docs em 2026-08-13. Reconferir a última versão em GitHub Packages.

[versions]
agp = "8.9.2"
kotlin = "2.2.0"
mwdat = "0.9.0"
coroutines = "1.8.1"
coreKtx = "1.13.1"
lifecycle = "2.8.3"
activityCompose = "1.9.0"
composeBom = "2024.06.00"
junit = "4.13.2"
testRunner = "1.6.2"
testExtJunit = "1.2.1"
securityCrypto = "1.1.0-alpha06"
mlkitText = "16.0.1"
work = "2.9.1"
okhttp = "4.12.0"

[libraries]
# Meta Wearables Device Access Toolkit. mwdat-display omitido de propósito: os
# Ray-Ban Meta não têm display (nosso único canal de saída é áudio).
mwdat-core = { group = "com.meta.wearable", name = "mwdat-core", version.ref = "mwdat" }
mwdat-camera = { group = "com.meta.wearable", name = "mwdat-camera", version.ref = "mwdat" }
mwdat-mockdevice = { group = "com.meta.wearable", name = "mwdat-mockdevice", version.ref = "mwdat" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

# Mapa de ruas escuro. MapLibre Native é o fork do Mapbox GL v1 de antes da
# mudança de licença — BSD-2-Clause, sem chave de API, sem telemetria, e **sem
# depender do Google Play Services**, que o aparelho da corporação pode não ter.
#
# Tiles do OpenFreeMap: livre, sem registro, sem chave, sem limite declarado, com
# estilo escuro pronto. A alternativa era MapTiler ou Mapbox, e as duas exigem
# chave em `local.properties` e têm cota — dependência operacional que um piloto
# de segurança pública não deveria ter.
#
# `android-sdk` (11.x) e não `android-sdk-opengl` (13.x): a 13 embarca um módulo
# `prefab/` com a `.so` não-strippada de 162 MB, que só entra no build de quem
# linka C++ próprio, mas infla o download da build inteira. A 11.11.0 tem o mesmo
# `jni/` e 14,8 MB de AAR.
maplibre = { module = "org.maplibre.gl:android-sdk", version = "11.11.0" }

# `org.json` real para os testes de JVM. O Android empacota essa mesma API, mas o
# unit test recebe um stub que lança "not mocked" em qualquer método — o que
# esconderia o caminho de renovação de sessão inteiro atrás de uma exceção de
# infraestrutura. Test-only, domínio público, mesma API já usada em produção.
json-jvm = { module = "org.json:json", version = "20240303" }

# Repouso cifrado: EncryptedFile + chave no Android Keystore (M6 — core-evidence).
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
# OCR de placa on-device (modelo Latin embarcado, roda offline) — M6.
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitText" }

# Fila offline durável, drenada por WorkManager com constraints (M7).
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
# Cliente REST do Supabase (PostgREST). Sem SDK pesado; só HTTP + JSON (M7).
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "testRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "testExtJunit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
